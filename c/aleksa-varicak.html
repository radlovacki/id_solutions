<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aleksa Varićak — CTO, ID Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f2f5;
      --surface: rgba(255,255,255,0.72);
      --border: rgba(90,110,180,0.18);
      --indigo: #4a5bbf;
      --indigo-light: #8e9ee0;
      --indigo-dim: #2e3d99;
      --dark: #1a1d2e;
      --muted: #6b7280;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 75% 55% at 50% -8%, rgba(74,91,191,0.14) 0%, transparent 65%),
        radial-gradient(ellipse 35% 25% at 5% 95%, rgba(74,91,191,0.08) 0%, transparent 55%),
        url("data:image/svg+xml,%3Csvg width='52' height='52' viewBox='0 0 52 52' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M26 1l3 8h8l-6.5 5 2.5 8L26 17l-7 5 2.5-8L15 9h8z' fill='%234a5bbf' fill-opacity='0.03'/%3E%3C/svg%3E");
      font-family: 'DM Sans', sans-serif;
      color: var(--dark);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 20px 80px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrap {
      position: relative;
      width: 118px;
      height: 118px;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--indigo), var(--indigo-light), var(--indigo-dim), var(--indigo-light), var(--indigo));
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar-inner {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--bg);
      z-index: 1;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--dark);
      line-height: 1.1;
    }

    .title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--indigo);
    }

    .title-line::before,
    .title-line::after {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      background: var(--indigo);
      opacity: 0.5;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.98rem;
      color: var(--muted);
      max-width: 300px;
      line-height: 1.5;
    }

    /* ── Links ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--dark);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      box-shadow: 0 2px 12px rgba(74,91,191,0.08);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(74,91,191,0.07), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .link-btn:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 28px rgba(74,91,191,0.16);
      background: rgba(255,255,255,0.92);
    }

    .link-btn:hover::before { opacity: 1; }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg { width: 20px; height: 20px; }

    .link-text { flex: 1; }

    .link-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1px;
    }

    .link-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--dark);
    }

    .link-arrow {
      color: var(--indigo);
      opacity: 0.7;
      font-size: 1rem;
      transition: transform 0.18s;
    }

    .link-btn:hover .link-arrow {
      transform: translateX(3px);
      opacity: 1;
    }

    /* icon colors */
    .ico-web    { background: linear-gradient(135deg, #1a1d2e, #2e3d99); }
    .ico-insta  { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .ico-email  { background: linear-gradient(135deg, #4a5bbf, #2e3d99); }
    .ico-maps   { background: linear-gradient(135deg, #4285F4, #34A853); }
    .ico-li     { background: #0077b5; }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 6px 0;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .footer a {
      color: var(--indigo);
      text-decoration: none;
    }

    /* stagger animations */
    .links .link-btn:nth-child(1)  { animation: fadeUp 0.6s 0.15s ease both; }
    .links .link-btn:nth-child(2)  { animation: fadeUp 0.6s 0.22s ease both; }
    .links .link-btn:nth-child(3)  { animation: fadeUp 0.6s 0.29s ease both; }
    .links .link-btn:nth-child(4)  { animation: fadeUp 0.6s 0.36s ease both; }
    .links .link-btn:nth-child(5)  { animation: fadeUp 0.6s 0.43s ease both; }
    .links .link-btn:nth-child(n+6){ animation: fadeUp 0.6s 0.50s ease both; }
  </style>
</head>
