<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ognjen Stojanov — COO, ID Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b1410;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(100,190,130,0.18);
      --green: #5eba82;
      --green-light: #9ddbb5;
      --green-dim: #357a52;
      --text: #e8f2ec;
      --muted: #7a9e88;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 50% at 50% -5%, rgba(94,186,130,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 40% 30% at 95% 85%, rgba(94,186,130,0.06) 0%, transparent 55%),
        url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M32 4 L36 16 L48 16 L38 24 L42 36 L32 28 L22 36 L26 24 L16 16 L28 16 Z' fill='%235eba82' fill-opacity='0.025'/%3E%3C/svg%3E");
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 20px 80px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrap {
      position: relative;
      width: 118px;
      height: 118px;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--green), var(--green-light), var(--green-dim), var(--green-light), var(--green));
      animation: spin 8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar-inner {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--bg);
      z-index: 1;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      line-height: 1.1;
    }

    .title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green);
    }

    .title-line::before,
    .title-line::after {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      background: var(--green);
      opacity: 0.5;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.98rem;
      color: var(--muted);
      max-width: 300px;
      line-height: 1.5;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      box-shadow: 0 2px 16px rgba(0,0,0,0.35);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(94,186,130,0.08), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .link-btn:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 32px rgba(94,186,130,0.13);
      background: rgba(255,255,255,0.07);
    }

    .link-btn:hover::before { opacity: 1; }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg { width: 20px; height: 20px; }

    .link-text { flex: 1; }

    .link-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1px;
    }

    .link-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
    }

    .link-arrow {
      color: var(--green);
      opacity: 0.7;
      font-size: 1rem;
      transition: transform 0.18s;
    }

    .link-btn:hover .link-arrow { transform: translateX(3px); opacity: 1; }

    .ico-web   { background: linear-gradient(135deg, #0d2018, #1a4a2e); }
    .ico-email { background: linear-gradient(135deg, #5eba82, #357a52); }
    .ico-li    { background: #0077b5; }
    .ico-maps  { background: linear-gradient(135deg, #4285F4, #34A853); }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 6px 0;
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .footer a { color: var(--green); text-decoration: none; }

    .links .link-btn:nth-child(1)  { animation: fadeUp 0.6s 0.15s ease both; }
    .links .link-btn:nth-child(2)  { animation: fadeUp 0.6s 0.22s ease both; }
    .links .link-btn:nth-child(3)  { animation: fadeUp 0.6s 0.29s ease both; }
    .links .link-btn:nth-child(4)  { animation: fadeUp 0.6s 0.36s ease both; }
    .links .link-btn:nth-child(5)  { animation: fadeUp 0.6s 0.43s ease both; }
    .links .link-btn:nth-child(n+6){ animation: fadeUp 0.6s 0.50s ease both; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-inner">
        <img src="ognjen-stojanov.jpg" alt="Ognjen Stojanov"/>
      </div>
    </div>
    <div>
      <div class="name">Ognjen Stojanov</div>
      <div class="tagline">Turning strategy into execution,<br>keeping everything in motion.</div>
      <div class="title-line">Chief Operating Officer</div>
    </div>
  </div>

  <div class="links">

    <a class="link-btn" href="https://www.idsolutions.in.rs/" target="_blank" rel="noopener">
      <div class="link-icon ico-web">
        <svg viewBox="0 0 24 24" fill="none" stroke="#9ddbb5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <div class="link-text">
        <div class="link-label">Company</div>
        <div class="link-title">ID Solutions</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a class="link-btn" href="https://www.linkedin.com/in/ognjen-stojanov-b27374385/" target="_blank" rel="noopener">
      <div class="link-icon ico-li">
        <svg viewBox="0 0 24 24" fill="#fff">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
          <rect x="2" y="9" width="4" height="12"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
      </div>
      <div class="link-text">
        <div class="link-label">LinkedIn</div>
        <div class="link-title">Ognjen Stojanov</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a class="link-btn" href="mailto:ognjen.stojanov@teslavs.edu.rs">
      <div class="link-icon ico-email">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="link-text">
        <div class="link-label">Business Email</div>
        <div class="link-title">ognjen.stojanov@teslavs.edu.rs</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <div class="divider"></div>

    <a class="link-btn" href="https://maps.google.com/?q=Sterijina+40-44+Vrsac+26300+Serbia" target="_blank" rel="noopener">
      <div class="link-icon ico-maps">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <div class="link-text">
        <div class="link-label">Visit Us</div>
        <div class="link-title">Sterijina 40–44, Vršac, Serbia</div>
      </div>
      <span class="link-arrow">→</span>
    </a>

  </div>

  <div class="footer">
    &copy; 2025 Ognjen Stojanov &nbsp;·&nbsp; <a href="https://www.idsolutions.in.rs/">ID Solutions</a>
  </div>

</div>
</body>
</html>
