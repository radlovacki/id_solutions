<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mila Popović — CEO, ID Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f5f0eb;
      --dark: #1a1410;
      --gold: #c8a96e;
      --gold-light: #e8d5b0;
      --muted: #7a6e65;
      --card-bg: rgba(255,255,255,0.65);
      --border: rgba(200,169,110,0.25);
    }

    body {
      min-height: 100vh;
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(200,169,110,0.18) 0%, transparent 70%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8a96e' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      font-family: 'DM Sans', sans-serif;
      color: var(--dark);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 20px 80px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrap {
      position: relative;
      width: 118px;
      height: 118px;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(var(--gold), var(--gold-light), var(--gold), var(--gold-light), var(--gold));
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .avatar-inner {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--cream);
      z-index: 1;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--dark);
      line-height: 1.1;
    }

    .title-line {
      display: flex;
      align-items: center;
      margin-left: auto;
      margin-right: auto;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .title-line::before, .title-line::after {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.98rem;
      color: var(--muted);
      max-width: 300px;
      line-height: 1.5;
    }

    /* ── Links ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--dark);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      box-shadow: 0 2px 12px rgba(26,20,16,0.07);
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(200,169,110,0.08), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .link-btn:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 28px rgba(26,20,16,0.13);
      background: rgba(255,255,255,0.85);
    }

    .link-btn:hover::before { opacity: 1; }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 20px;
      height: 20px;
    }

    .link-text {
      flex: 1;
    }

    .link-label {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1px;
    }

    .link-title {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--dark);
    }

    .link-arrow {
      color: var(--gold);
      opacity: 0.7;
      font-size: 1rem;
      transition: transform 0.18s;
    }

    .link-btn:hover .link-arrow {
      transform: translateX(3px);
      opacity: 1;
    }

    /* icon colors */
    .ico-web    { background: linear-gradient(135deg, #1a1410, #3d2e22); }
    .ico-insta  { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .ico-email  { background: linear-gradient(135deg, #c8a96e, #a07840); }
    .ico-maps   { background: linear-gradient(135deg, #4285F4, #34A853); }
    .ico-li     { background: #0077b5; }
    .ico-tiktok { background: linear-gradient(135deg, #010101, #ff0050); }

    /* ── Divider ── */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 6px 0;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .footer a {
      color: var(--gold);
      text-decoration: none;
    }

    /* stagger animation on links */
    .links .link-btn:nth-child(1)  { animation: fadeUp 0.6s 0.15s ease both; }
    .links .link-btn:nth-child(2)  { animation: fadeUp 0.6s 0.22s ease both; }
    .links .link-btn:nth-child(3)  { animation: fadeUp 0.6s 0.29s ease both; }
    .links .link-btn:nth-child(4)  { animation: fadeUp 0.6s 0.36s ease both; }
    .links .link-btn:nth-child(5)  { animation: fadeUp 0.6s 0.43s ease both; }
    .links .link-btn:nth-child(n+6){ animation: fadeUp 0.6s 0.50s ease both; }
  </style>
</head>
