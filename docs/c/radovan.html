<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radovan Cvijović — Profil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      border: 1px solid #e2e6ea;
      overflow: hidden;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }

    .card-header {
      background: #1a3a5c;
      padding: 2rem 1.5rem 1.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: #2e6da4;
      border: 2px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 22px;
      color: #e8f2fb;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .header-info .name {
      font-size: 20px;
      font-weight: 600;
      color: #e8f2fb;
      letter-spacing: 0.3px;
    }

    .header-info .location {
      font-size: 13px;
      color: #90b8d8;
      margin-top: 4px;
      font-family: Arial, sans-serif;
    }

    .card-body {
      padding: 1.5rem;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #9aa5b1;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-family: Arial, sans-serif;
    }

    .address-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 1.75rem;
    }

    .address-row i {
      font-size: 20px;
      color: #6b7c93;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .address-row .street {
      font-size: 15px;
      font-weight: 600;
      color: #1a2b3c;
    }

    .address-row .city {
      font-size: 14px;
      color: #6b7c93;
      margin-top: 3px;
      font-family: Arial, sans-serif;
    }

    .divider {
      border: none;
      border-top: 1px solid #e9ecef;
      margin-bottom: 1.5rem;
    }

    .contacts {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f7f9fc;
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid #edf0f5;
    }

    .contact-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon.supruga {
      background: #e6f1fb;
    }

    .contact-icon.supruga i {
      color: #185fa5;
      font-size: 18px;
    }

    .contact-icon.cerka {
      background: #eaf3de;
    }

    .contact-icon.cerka i {
      color: #3b6d11;
      font-size: 18px;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-info .label {
      font-size: 12px;
      color: #9aa5b1;
      font-family: Arial, sans-serif;
    }

    .contact-info .number {
      font-size: 15px;
      font-weight: 600;
      color: #1a2b3c;
      margin-top: 2px;
      font-family: Arial, sans-serif;
    }

    .call-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #d1d9e0;
      background: #ffffff;
      color: #6b7c93;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .call-btn:hover {
      background: #1a3a5c;
      color: #ffffff;
      border-color: #1a3a5c;
    }

    .call-btn i {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="avatar">RC</div>
      <div class="header-info">
        <p class="name">Radovan Cvijović</p>
        <p class="location">Vršac, Srbija</p>
      </div>
    </div>

    <div class="card-body">

      <p class="section-label">Adresa</p>
      <div class="address-row">
        <i class="ti ti-map-pin"></i>
        <div>
          <p class="street">Vojnički Trg 21/35</p>
          <p class="city">26300 Vršac</p>
        </div>
      </div>

      <hr class="divider">

      <p class="section-label">Kontakti</p>
      <div class="contacts">

        <div class="contact-item">
          <div class="contact-icon supruga">
            <i class="ti ti-heart"></i>
          </div>
          <div class="contact-info">
            <p class="label">Supruga</p>
            <p class="number">+381 63 735 6453</p>
          </div>
          <a href="tel:+381637356453" class="call-btn" aria-label="Pozovi suprugu">
            <i class="ti ti-phone"></i>
          </a>
        </div>

        <div class="contact-item">
          <div class="contact-icon cerka">
            <i class="ti ti-user"></i>
          </div>
          <div class="contact-info">
            <p class="label">Ćerka</p>
            <p class="number">+381 64 569 3021</p>
          </div>
          <a href="tel:+381645693021" class="call-btn" aria-label="Pozovi ćerku">
            <i class="ti ti-phone"></i>
          </a>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
